[tool.poetry]
package-mode = false

[project]
name = "blaise-cleanup-databases"

[tool.poetry.dependencies]
python = "^3.13"
functions-framework = "^3.10.2"
flask = "^3.1.3"
pymysql = "^1.1"
blaise-restapi = {git = "https://github.com/ONSdigital/blaise-api-python-client", rev = "v1.0.2"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
mock = "^5.2.0"
ruff = "^0.15.22"
pyright = "^1.1.411"
vulture = "^2.16"
mock-alchemy = "^0.2.6"
pytest-cov = "^7.1.0"
deptry = "^0.25.1"

[tool.deptry]
per_rule_ignores = { DEP002 = ["functions-framework"] }

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "C90", "SIM", "RUF", "Q"]

[tool.pyright]
typeCheckingMode = "strict"
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.vulture]
min_confidence = 70

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.report]
omit = ["tests/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
